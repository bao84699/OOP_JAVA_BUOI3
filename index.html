<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java OOP – Bài giảng tương tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: cửa sổ kính mờ nổi trên nền nhòe; thanh icon nổi bên trái; tab chuyên mục ở trên; ô nổi bật lớn + hàng thẻ gợi ý. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --h: 262;
  --fg: #1f1b33; --fg2: #4b4764; --fg3: #7a7692;
  --glass: rgba(255, 255, 255, .44); --glass2: rgba(255, 255, 255, .58); --glass3: rgba(255, 255, 255, .80);
  --edge: rgba(255, 255, 255, .78); --edge2: rgba(255, 255, 255, .42);
  --shadow: 0 40px 90px -30px rgba(70, 40, 100, .45), inset 0 1px 0 rgba(255, 255, 255, .95);
  --card-shadow: 0 10px 30px -12px rgba(70, 40, 100, .25);
  --code-bg: rgba(27, 24, 46, .90); --code-fg: #ece9ff;
  --k: #c7a8ff; --t: #7fd6ff; --s: #ffd39a; --n: #ff9fb2; --c: #8089ad; --m: #94f0c4;
  --ok: #0f9f6e; --ok-bg: rgba(20, 190, 130, .16); --bad: #d93a45; --bad-bg: rgba(235, 70, 80, .14); --warn: #b86e00; --warn-bg: rgba(255, 170, 30, .20);
  --ac: hsl(var(--h) 78% 56%); --ac2: hsl(calc(var(--h) + 38) 82% 62%); --ac-soft: hsl(var(--h) 90% 60% / .16);
  --sc1: #ffd2b0; --sc2: #f4a9c4; --sc3: #9fd3e6; --sc4: #fff0d6; --sc5: #c9b6f2;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --fg: #f3f1ff; --fg2: #c9c5e2; --fg3: #9a96b8;
  --glass: rgba(34, 32, 60, .46); --glass2: rgba(52, 48, 88, .46); --glass3: rgba(70, 64, 112, .70);
  --edge: rgba(255, 255, 255, .20); --edge2: rgba(255, 255, 255, .11);
  --shadow: 0 40px 90px -30px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .16);
  --card-shadow: 0 10px 30px -12px rgba(0, 0, 0, .5);
  --code-bg: rgba(12, 10, 26, .78);
  --ok: #4be0a8; --ok-bg: rgba(60, 220, 160, .16); --bad: #ff7a85; --bad-bg: rgba(255, 90, 100, .16); --warn: #ffc15a; --warn-bg: rgba(255, 190, 70, .16);
  --ac: hsl(var(--h) 90% 70%); --ac2: hsl(calc(var(--h) + 38) 90% 68%); --ac-soft: hsl(var(--h) 90% 70% / .20);
  --sc1: #3a2b6e; --sc2: #6b2a63; --sc3: #1f4a78; --sc4: #2a2652; --sc5: #4a2f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); color: var(--fg); font-size: 15px; line-height: 1.55; background: #e9d9f0; -webkit-font-smoothing: antialiased; }
:root[data-theme="dark"] body { background: #14122a; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .88em; background: var(--ac-soft); padding: .08em .38em; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
svg.i { width: 20px; height: 20px; flex: none; }

/* ---------- nền nhòe ---------- */
.scene { position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: radial-gradient(1200px 700px at 15% 10%, var(--sc1), transparent 60%), radial-gradient(900px 700px at 90% 20%, var(--sc3), transparent 60%), radial-gradient(1000px 800px at 60% 100%, var(--sc2), transparent 60%), linear-gradient(160deg, var(--sc4), var(--sc5)); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; animation: drift 26s ease-in-out infinite alternate; }
.b1 { width: 46vmax; height: 46vmax; left: -12vmax; top: 30%; background: color-mix(in srgb, var(--sc2) 80%, #fff); }
.b2 { width: 38vmax; height: 38vmax; right: -10vmax; top: -8vmax; background: color-mix(in srgb, var(--sc3) 80%, #fff); animation-duration: 32s; }
.b3 { width: 30vmax; height: 30vmax; right: 18%; bottom: -14vmax; background: color-mix(in srgb, var(--sc1) 85%, #fff); animation-duration: 38s; }
@keyframes drift { to { transform: translate3d(5vmax, -4vmax, 0) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } * { scroll-behavior: auto !important; } }

/* ---------- cửa sổ kính ---------- */
.window { position: relative; max-width: 1260px; margin: clamp(8px, 2.2vw, 30px) auto; min-height: calc(100dvh - clamp(16px, 4.4vw, 60px));
  border-radius: 36px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5);
  padding: 20px 24px 32px 92px; width: calc(100% - clamp(16px, 4.4vw, 60px)); }
.rail { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 10px 7px; border-radius: 28px;
  background: var(--glass2); border: 1px solid var(--edge); box-shadow: var(--card-shadow); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); z-index: 5; }
.rail button { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--fg2); transition: background .15s, color .15s; }
.rail button:hover { background: var(--glass3); color: var(--fg); }
.rail button.on { background: var(--ac); color: #fff; box-shadow: 0 6px 16px -6px var(--ac); }
.rail .sep { height: 1px; background: var(--edge2); margin: 4px 8px; }
.badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: #ff5a6a; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }

.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: nowrap; }
.search { position: relative; flex: 0 0 210px; }
.search input { width: 100%; height: 42px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass2); padding: 0 16px 0 40px; outline: none; }
.search input::placeholder { color: var(--fg3); }
.search svg { position: absolute; left: 13px; top: 11px; color: var(--fg3); }
.sres { position: absolute; z-index: 20; top: 48px; left: 0; width: min(360px, 90vw); background: var(--glass3); border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--card-shadow); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); padding: 6px; }
.sres button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 12px; }
.sres button:hover { background: var(--ac-soft); }
.sres small { display: block; color: var(--fg3); }
.tabs { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; justify-content: center; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; font-weight: 600; color: var(--fg2); white-space: nowrap; }
.tabs button:hover { background: var(--glass2); }
.tabs button.on { background: var(--glass3); color: var(--fg); font-weight: 800; box-shadow: var(--card-shadow); }
.chip { text-decoration: none; color: var(--fg); display: flex; align-items: center; gap: 9px; border: 1px solid var(--edge); background: var(--glass2); border-radius: 999px; padding: 4px 14px 4px 4px; height: 42px; white-space: nowrap; }
.chip .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(140deg, var(--ac), var(--ac2)); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.chip b { font-size: 13px; display: block; line-height: 1.15; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.chip small { color: var(--fg3); font-size: 11px; }

/* ---------- chung ---------- */
.card { background: var(--glass2); border: 1px solid var(--edge2); border-radius: 22px; padding: 16px; box-shadow: var(--card-shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h h4 { font-size: 15px; }
.muted { color: var(--fg3); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 17px; border-radius: 999px; border: 1px solid var(--edge); background: var(--glass3); font-weight: 700; font-size: 14px; transition: transform .12s, box-shadow .12s, background .12s; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--card-shadow); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.pri { background: linear-gradient(135deg, var(--ac), var(--ac2)); color: #fff; border-color: transparent; box-shadow: 0 8px 20px -8px var(--ac); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.ic { padding: 9px; }
.pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--glass3); border: 1px solid var(--edge2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.lvl { letter-spacing: 2px; color: var(--ac); font-size: 11px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 2px 12px; }
.sec-h h3 { font-size: 18px; }
.sec-h a { color: var(--fg2); font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }

/* ---------- trang chủ ---------- */
.home { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 14px; }
.mini { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; text-align: left; background: transparent; padding: 7px; border-radius: 14px; }
.mini:hover { background: var(--glass3); }
.mini .th { width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; font: 800 12px var(--mono); background: linear-gradient(145deg, hsl(var(--h) 80% 58%), hsl(calc(var(--h) + 40) 80% 44%)); }
.mini b { display: block; font-size: 13px; line-height: 1.25; }
.mini small { color: var(--fg3); font-size: 11.5px; }
.mini .go { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; background: var(--glass3); display: grid; place-items: center; flex: none; }
.mini .go svg { width: 12px; height: 12px; }
.hero { position: relative; overflow: hidden; border-radius: 28px; min-height: 330px; color: #fff; padding: 30px 32px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px;
  background: radial-gradient(600px 300px at 85% 10%, hsl(calc(var(--h) + 60) 90% 66% / .85), transparent 65%), linear-gradient(135deg, hsl(var(--h) 70% 30%), hsl(calc(var(--h) + 30) 75% 42%) 55%, hsl(calc(var(--h) + 55) 85% 55%));
  box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255, 255, 255, .35); }
.hero .glyph { position: absolute; right: 26px; top: 14px; font: 800 clamp(90px, 15vw, 190px)/1 var(--mono); color: rgba(255, 255, 255, .16); letter-spacing: -.06em; user-select: none; }
.hero .snip { position: absolute; right: 30px; bottom: 30px; font: 12.5px/1.6 var(--mono); color: rgba(255, 255, 255, .88); background: rgba(10, 8, 30, .34); padding: 12px 16px; border-radius: 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .2); white-space: pre; }
.hero .tags { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.hero .tags span { background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .28); padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hero h2 { font-size: clamp(28px, 4.6vw, 46px); line-height: 1.08; position: relative; max-width: 14ch; }
.hero p { max-width: 46ch; color: rgba(255, 255, 255, .9); position: relative; }
.hero .btn { background: rgba(255, 255, 255, .22); color: #fff; border-color: rgba(255, 255, 255, .35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.hero .btn.pri { background: #fff; color: hsl(var(--h) 60% 32%); }
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.poster { position: relative; text-align: left; border: 1px solid rgba(255, 255, 255, .3); border-radius: 22px; min-height: 190px; padding: 14px; color: #fff; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; box-shadow: var(--card-shadow);
  background: linear-gradient(160deg, hsl(var(--h) 75% 48%), hsl(calc(var(--h) + 45) 80% 36%)); transition: transform .15s; }
.poster:hover { transform: translateY(-3px); }
.poster .g { position: absolute; left: 10px; top: 4px; font: 800 58px/1 var(--mono); color: rgba(255, 255, 255, .18); }
.poster b { font-size: 15px; line-height: 1.25; position: relative; }
.poster small { opacity: .85; position: relative; }
.poster .pl { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #222; display: grid; place-items: center; }
.poster .pl svg { width: 13px; height: 13px; }
.poster .lvl { color: #fff; opacity: .9; position: relative; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); opacity: .35; }
.dots i.on { opacity: .9; background: var(--ac); }

/* ---------- tiêu đề phần + vòng tiến độ ---------- */
.sec-head { display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-radius: 24px; color: #fff; margin-bottom: 14px; flex-wrap: wrap;
  background: linear-gradient(120deg, hsl(var(--h) 70% 36%), hsl(calc(var(--h) + 40) 80% 50%)); box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255, 255, 255, .3); }
.sec-head .gl { font: 800 34px/1 var(--mono); opacity: .9; min-width: 64px; }
.sec-head h2 { font-size: 22px; }
.sec-head p { opacity: .9; font-size: 13.5px; max-width: 60ch; }
.sec-head .meta { margin-left: auto; text-align: right; font-size: 12.5px; }
.ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255, 255, 255, .25) 0); display: grid; place-items: center; font-weight: 800; font-size: 13px; position: relative; flex: none; }
.ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: hsl(var(--h) 60% 34%); }
.ring span { position: relative; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--glass2); border: 1px solid var(--edge2); margin-bottom: 14px; }
.seg button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-weight: 700; color: var(--fg2); }
.seg button.on { background: var(--glass3); color: var(--fg); box-shadow: var(--card-shadow); }

/* ---------- bài học ---------- */
.lesson { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.lesson h3 { font-size: 20px; margin-top: 12px; }
.lesson .p { color: var(--fg); }
.lesson .p b { font-weight: 800; }
.callout { border-radius: 18px; padding: 14px 16px; background: var(--ac-soft); border: 1px solid var(--edge2); }
.callout.warn { background: var(--warn-bg); }
.tbl { overflow-x: auto; border-radius: 18px; border: 1px solid var(--edge2); background: var(--glass2); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--edge2); }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- code ---------- */
.code { background: var(--code-bg); color: var(--code-fg); border-radius: 16px; font: 13px/1.7 var(--mono); overflow-x: auto; padding: 8px 0; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.code ol { list-style: none; margin: 0; padding: 0; min-width: max-content; }
.code li { display: flex; padding-right: 16px; border-left: 3px solid transparent; }
.code .ln { width: 40px; text-align: right; padding-right: 14px; opacity: .38; user-select: none; flex: none; }
.code .tx { white-space: pre; }
.code .k { color: var(--k); } .code .t { color: var(--t); } .code .s { color: var(--s); } .code .n { color: var(--n); } .code .c { color: var(--c); font-style: italic; } .code .m { color: var(--m); }
.code li.cur { background: rgba(255, 200, 80, .20); border-left-color: #ffc857; }
.code li.past { opacity: .6; }
.code li.err { background: rgba(255, 90, 100, .28); border-left-color: #ff5a64; }
.code.pick li { cursor: pointer; }
.code.pick li:hover { background: rgba(255, 255, 255, .08); }
.code li.mark { background: rgba(255, 90, 100, .22); border-left-color: #ff6b75; }
.code li.hit { background: rgba(60, 220, 150, .24); border-left-color: #3ee0a0; }
.code li.miss { background: rgba(255, 190, 70, .22); border-left-color: #ffbe46; }
.code li.fp { background: rgba(255, 90, 100, .28); border-left-color: #ff5a64; text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .3); }
.blank { font: inherit; background: rgba(255, 255, 255, .12); color: #fff; border: 1px dashed rgba(255, 255, 255, .5); border-radius: 6px; padding: 0 6px; width: 9ch; outline: none; }
.blank.ok { border-color: #3ee0a0; background: rgba(60, 220, 150, .22); }
.blank.bad { border-color: #ff6b75; background: rgba(255, 90, 100, .24); }
.editor { display: flex; background: var(--code-bg); border-radius: 16px; overflow-x: auto; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.editor .gut { padding: 12px 6px 12px 14px; text-align: right; color: rgba(255, 255, 255, .34); font: 13px/1.7 var(--mono); white-space: pre; user-select: none; flex: none; }
.editor .gut .e { color: #ff6b75; font-weight: 800; }
.editor textarea { flex: 1; min-width: 320px; background: transparent; color: var(--code-fg); border: 0; outline: none; resize: none; padding: 12px 14px 12px 8px; font: 13px/1.7 var(--mono); white-space: pre; overflow: hidden; tab-size: 4; caret-color: #ffc857; }

/* ---------- demo + tracer ---------- */
.demo .args { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 12px 0 4px; }
.demo .args label { display: flex; flex-direction: column; font-size: 12px; font-weight: 700; color: var(--fg3); gap: 3px; }
.demo .args input { height: 36px; border-radius: 12px; border: 1px solid var(--edge); background: var(--glass3); padding: 0 12px; font: 13px var(--mono); min-width: 90px; width: 150px; outline: none; }
.note { font-size: 13.5px; color: var(--fg2); margin-top: 8px; }
.tracer { margin-top: 12px; }
.tr-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.tr-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tr-note { min-height: 44px; border-radius: 14px; padding: 10px 14px; background: var(--ac-soft); border: 1px solid var(--edge2); font-size: 13.5px; font-family: var(--mono); }
.tr-note.exc { background: var(--bad-bg); color: var(--bad); }
.vars { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); background: var(--glass2); border-radius: 14px; overflow: hidden; }
.vars th { text-align: left; font: 700 11px var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); padding: 7px 10px; background: var(--glass3); }
.vars td { padding: 6px 10px; border-top: 1px solid var(--edge2); word-break: break-all; }
.vars tr.chg td { background: var(--warn-bg); }
.vars td:nth-child(2) { color: var(--fg3); }
.console { background: #0f0d1c; color: #d6f7e5; font: 12.5px/1.5 var(--mono); border-radius: 14px; padding: 9px 12px; min-height: 40px; white-space: pre-wrap; }
.console small { color: #7e86a8; display: block; font: 700 10.5px var(--font); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.tr-ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tr-ctl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--ac); }
.tr-ctl .cnt { font: 700 12px var(--mono); color: var(--fg2); min-width: 64px; text-align: center; }
.banner { border-radius: 14px; padding: 10px 14px; font-size: 13.5px; margin-top: 10px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- sân chơi ---------- */
.play-vars { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.play-vars input { height: 34px; border-radius: 10px; border: 1px solid var(--edge); background: var(--glass3); padding: 0 10px; font: 13px var(--mono); }

/* ---------- tô màu cú pháp ---------- */
const KW = new Set(['if', 'else', 'while', 'for', 'do', 'switch', 'case', 'default', 'return', 'break', 'continue', 'new', 'throw', 'throws', 'try', 'catch', 'finally', 'static', 'public', 'private', 'protected', 'final', 'class', 'void', 'true', 'false', 'null', 'yield', 'this']);
const TY = new Set(['int', 'long', 'double', 'float', 'boolean', 'char', 'byte', 'short', 'var']);
function hlLine(line) {
  const re = /(\/\/.*$)|("(?:\\.|[^"\\])*"?)|('(?:\\.|[^'\\])*'?)|(\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[LlDdFf]?\b)|([\p{L}_$][\p{L}\p{N}_$]*)/gu;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if (m[2] || m[3]) out += '<span class="s">' + esc(m[2] || m[3]) + '</span>';
    else if (m[4]) out += '<span class="n">' + esc(m[4]) + '</span>';
    else {
      const w = m[5];
      if (/^__B\d+__$/.test(w)) out += '\u0001' + w.slice(3, -2) + '\u0001';
      else if (KW.has(w)) out += '<span class="k">' + w + '</span>';
      else if (TY.has(w) || (/^[A-Z]/.test(w) && line[last] !== '(')) out += '<span class="t">' + esc(w) + '</span>';
      else if (line[last] === '(') out += '<span class="m">' + esc(w) + '</span>';
      else out += esc(w);
    }
  }
  out += esc(line.slice(last));
  return out || ' ';
}
const hlLines = src => src.split('\n').map(hlLine);
function codeBlock(src, cls, lineCls) {
  const ls = hlLines(src);
  return '<div class="code ' + (cls || '') + '"><ol>' + ls.map((l, i) => '<li data-l="' + (i + 1) + '" class="' + ((lineCls && lineCls[i + 1]) || '') + '"><span class="ln">' + (i + 1) + '</span><span class="tx">' + l + '</span></li>').join('') + '</ol></div>';
}
const stripSrc = s => s.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '').replace(/"(\\.|[^"\\\n])*"/g, '""');

const P = id => prog[id] || (prog[id] = { attempts: 0, hints: 0, done: false, best: 0 });
const saveProg = () => { if (user) store.set('jv_prog_' + user.mssv, prog); };
const status = id => { const p = prog[id]; return p && p.done ? 'done' : (p && p.attempts > 0 ? 'try' : 'new'); };
function secStats(s) { const d = s.exercises.filter(e => status(e.id) === 'done').length; return { done: d, total: s.exercises.length, pct: Math.round(100 * d / s.exercises.length) }; }

function applyTheme() {

  document.documentElement.setAttribute('data-theme', t);
}

/* ---------- gửi kết quả về Google Sheet ---------- */
let flushing = false;
async function flush() {
  if (!CFG.SHEET_URL || flushing || !outbox.length) { if (!outbox.length && CFG.SHEET_URL) syncState = 'ok'; updateBell(); return; }
  flushing = true; syncState = 'sending'; updateBell();
  try {
    while (outbox.length) {
      await fetch(CFG.SHEET_URL, { method: 'POST', mode: 'no-cors', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(outbox[0]) });
      outbox.shift(); store.set('jv_outbox', outbox);
    }
    syncState = 'ok';
  } catch (e) { syncState = 'err'; }
  flushing = false; updateBell();
}
function updateBell() {
  const b = $('#bell'); if (!b) return;
  const n = outbox.length; const bd = $('.badge', b);
  if (bd) { bd.textContent = n; bd.hidden = !n || syncState === 'off'; }
  b.title = syncState === 'off' ? 'Chưa kết nối Google Sheet' : n ? n + ' kết quả đang chờ gửi' : 'Tất cả kết quả đã được gửi';
}
function logAttempt(ex, r) {
  const p = P(ex.id); p.attempts++; p.best = Math.max(p.best || 0, r.score); p.last = Date.now();
  if (r.correct && !p.done) { p.done = true; p.doneAt = Date.now(); }
  saveProg();
  const rec = { ts: new Date().toISOString(), course: CFG.COURSE, secret: CFG.SECRET, name: user.name, mssv: user.mssv, section: ex.sec.id, exId: ex.id, type: ex.type, title: ex.title,
    correct: !!r.correct, score: Math.round(r.score * 100) / 100, attempt: p.attempts, hints: p.hints || 0, seconds: Math.min(3600, Math.round((Date.now() - openedAt) / 1000)), solutionViewed: !!p.sol, answer: String(r.answer || '').slice(0, 1800) };
  outbox.push(rec); if (outbox.length > 500) outbox.shift();
  store.set('jv_outbox', outbox); updateBell(); flush();
  refreshList();
}
function refreshList() {
  $$('.exitem').forEach(b => { const id = b.dataset.id, st = status(id); const el = $('.st', b); if (el) { el.className = 'st ' + st; el.innerHTML = st === 'done' ? ic('check') : ''; } });

  if (ss) { const c = $('#ex-count'); if (c) c.textContent = ss.done + '/' + ss.total; const rg = $('.sec-head .ring'); if (rg) { rg.style.setProperty('--p', ss.pct); $('span', rg).textContent = ss.pct + '%'; } }
}

function bindShell() {

  const ss = secStats(s);
  st.innerHTML = '<div class="sec-head"><span class="gl">' + esc(s.glyph) + '</span><div><h2>Phần ' + s.num + ': ' + esc(s.title) + '</h2><p>' + esc(s.blurb) + '</p></div>' +

function viewLesson(s) {
  const body = $('#body'); const parts = [];
  s.lesson.forEach((b, i) => {
    switch (b.t) {
      case 'h': parts.push('<h3>' + esc(b.x) + '</h3>'); break;
      case 'p': parts.push('<p class="p">' + rt(b.x) + '</p>'); break;
      case 'tip': parts.push('<div class="callout">' + rt(b.x) + '</div>'); break;
      case 'warn': parts.push('<div class="callout warn">' + rt(b.x) + '</div>'); break;
      case 'code': parts.push(codeBlock(b.code)); break;
      case 'table': parts.push('<div class="tbl"><table><thead><tr>' + b.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + b.rows.map(r => '<tr>' + r.map(c => '<td>' + rt(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'); break;
      case 'demo': parts.push('<div data-demo="' + i + '"></div>'); break;
      case 'play': parts.push('<div data-play="' + i + '"></div>'); break;
      default: break;
    }
  });
  parts.push('<div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" data-go="' + s.id + '/ex">Làm bài tập phần này ' + ic('next') + '</button></div>');
  body.innerHTML = '<div class="lesson">' + parts.join('') + '</div>';
  $$('[data-go]', body).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $$('[data-demo]', body).forEach(el => mountDemo(el, s.lesson[+el.dataset.demo]));
  $$('[data-play]', body).forEach(el => mountPlay(el, s.lesson[+el.dataset.play]));
}

    const n = ta.value.split('\n').length;
    gut.innerHTML = Array.from({ length: n }, (_, i) => '<div class="' + (errLine === i + 1 ? 'e' : '') + '">' + (i + 1) + '</div>').join('');
  };
  const insert = t => { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); };
  ta.addEventListener('input', () => { errLine = 0; sync(); if (cb.onInput) cb.onInput(ta.value); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); insert('    '); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (cb.onRun) cb.onRun(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); const before = ta.value.slice(0, ta.selectionStart); const line = before.slice(before.lastIndexOf('\n') + 1);
      let ind = line.match(/^\s*/)[0]; if (/\{\s*$/.test(line)) ind += '    '; insert('\n' + ind);
    } else if (e.key === '}') {
      const before = ta.value.slice(0, ta.selectionStart); const line = before.slice(before.lastIndexOf('\n') + 1);
      if (/^ {4,}$/.test(line) && ta.selectionStart === ta.selectionEnd) { e.preventDefault(); ta.setRangeText('}', ta.selectionStart - 4, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    }

  return { get: () => ta.value, set: v => { ta.value = v; sync(); }, mark: n => { errLine = n || 0; sync(); }, focus: () => ta.focus() };
}

/* ---------- bộ xem từng bước ---------- */
function mountTracer(root, code, res) {
  const steps = (res && res.trace) || []; const lines = hlLines(code); let i = 0, timer = null;
  function banner() {
    let h = '';
    const last = !steps.length || i === steps.length - 1;
    if (last) {
      if (res.ok && res.ret !== 'void' && res.value) h += '<div class="banner ok">Kết quả trả về: <b>' + esc(J.show(res.value)) + '</b></div>';
      else if (res.ok) h += '<div class="banner ok">Chạy xong.</div>';
      if (res.ex) h += '<div class="banner bad">Chương trình dừng vì ngoại lệ <b>' + esc(res.ex.cls) + '</b>' + (res.ex.msg ? ': ' + esc(res.ex.msg) : '') + '</div>';
      if (res.err === 'compile') h += '<div class="banner bad">Lỗi biên dịch' + (res.line ? ' (dòng ' + res.line + ')' : '') + ': ' + esc(res.msg) + '</div>';
      else if (res.err) h += '<div class="banner bad">' + esc(res.msg) + '</div>';
      if (res.truncated) h += '<div class="banner warn">Chỉ hiển thị ' + steps.length + ' bước đầu tiên.</div>';
    }
    return h;
  }
  function draw() {
    const s = steps[i]; const past = new Set(); for (let k = 0; k < i; k++) past.add(steps[k].line);
    const lc = {}; if (s) lc[s.line] = 'cur'; past.forEach(l => { if (!lc[l]) lc[l] = 'past'; });
    if (res.err === 'compile' && res.line) lc[res.line] = 'err';
    const prev = i > 0 ? steps[i - 1] : null; const pm = {}; if (prev && prev.fn === (s && s.fn)) prev.vars.forEach(v => { pm[v[0]] = v[2]; });
    const vars = s ? s.vars.map(v => '<tr class="' + (!prev || prev.fn !== s.fn ? '' : (pm[v[0]] === undefined || pm[v[0]] !== v[2] ? 'chg' : '')) + '"><td>' + esc(v[0]) + '</td><td>' + esc(v[1]) + '</td><td>' + esc(v[2]) + '</td></tr>').join('') : '';
    const out = res.out ? res.out.slice(0, s ? s.outLen : res.out.length) : '';
    root.innerHTML = '<div class="tracer"><div class="tr-grid"><div>' + codeBlock(code, '', lc) + '</div><div class="tr-side">' +
      (s ? '<div class="tr-note ' + (s.exc ? 'exc' : '') + '">' + (esc(s.note) || (i === 0 ? 'Bước đầu tiên: dòng ' + s.line : 'Đã chạy dòng ' + s.line)) + '</div>' : '') +
      (s ? '<table class="vars"><thead><tr><th>Biến</th><th>Kiểu</th><th>Giá trị</th></tr></thead><tbody>' + (vars || '<tr><td colspan="3" class="muted">Chưa có biến</td></tr>') + '</tbody></table>' : '') +
      (out ? '<div class="console"><small>Output</small>' + esc(out) + '</div>' : '') +
      '</div></div>' +
      (steps.length ? '<div class="tr-ctl"><button class="btn ic sm" data-t="first" aria-label="Về bước đầu">' + ic('first') + '</button><button class="btn ic sm" data-t="prev" aria-label="Bước trước">' + ic('prev') + '</button><span class="cnt">' + (i + 1) + ' / ' + steps.length + '</span><button class="btn ic sm" data-t="next" aria-label="Bước sau">' + ic('next') + '</button><button class="btn ic sm" data-t="last" aria-label="Đến bước cuối">' + ic('last') + '</button><input type="range" min="0" max="' + (steps.length - 1) + '" value="' + i + '" aria-label="Thanh bước"><button class="btn sm" data-t="auto">' + (timer ? 'Dừng' : 'Tự chạy') + '</button></div>' : '') +
      banner() + '</div>';
    $$('[data-t]', root).forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.t;
      if (t === 'auto') { if (timer) { clearInterval(timer); timer = null; } else { if (i >= steps.length - 1) i = 0; timer = setInterval(() => { if (i < steps.length - 1) { i++; draw(); } else { clearInterval(timer); timer = null; draw(); } }, 750); } draw(); return; }
      if (timer) { clearInterval(timer); timer = null; }
      i = t === 'first' ? 0 : t === 'last' ? steps.length - 1 : t === 'prev' ? Math.max(0, i - 1) : Math.min(steps.length - 1, i + 1); draw();
    }));
    const rg = $('input[type=range]', root); if (rg) rg.addEventListener('input', () => { if (timer) { clearInterval(timer); timer = null; } i = +rg.value; draw(); });
  }
  draw();
}

/* --- dự đoán / trắc nghiệm --- */
function mountChoice(el, ex) {

      '<div class="choices" role="radiogroup">' + ex.choices.map((c, i) => {
        const cls = (done && i === ex.answer) || (reveal && i === ex.answer) ? 'right' : wrong.has(i) ? 'wrong' : sel === i ? 'sel' : '';
        return '<button class="choice ' + cls + '" data-i="' + i + '" role="radio" aria-checked="' + (sel === i) + '" ' + (done || wrong.has(i) ? 'disabled' : '') + '><span class="ltr">' + letters[i] + '</span><span>' + rt(c) + '</span></button>';
      }).join('') + '</div>' +

    $$('.choice', el).forEach(b => b.addEventListener('click', () => { sel = +b.dataset.i; draw(); }));
    $('#ck', el).addEventListener('click', check);

    if (done || reveal) {
      $('#fb', el).innerHTML = '<div class="explain"><b>' + (done ? 'Chính xác! ' : 'Đáp án đúng là ' + letters[ex.answer] + '. ') + '</b>' + rt(ex.explain) + '</div>';
      if (ex.run && done) { $('#tr', el).innerHTML = '<div class="sec-h" style="margin:10px 2px 0"><h3 style="font-size:15px">Xem code chạy từng bước</h3></div><div id="trx"></div>'; mountTracer($('#trx', el), ex.code, J.runCall(ex.code, ex.run.fn, ex.run.args, { trace: true })); }
    }

    else { wrong.add(sel); logAttempt(ex, { correct: false, score: 0, answer: ex.choices[sel] }); if (wrong.size >= 2) { reveal = true; P(ex.id).sol = true; saveProg(); } sel = null; }
    draw();
    if (!ok && !reveal) $('#fb', el).innerHTML = '<div class="explain bad">Chưa đúng, hãy thử lại. Bạn có thể dùng gợi ý bên dưới.</div>';
  }
  draw();
}

/* --- bắt lỗi --- */
function mountBug(el, ex) {
  const p = P(ex.id); const bugs = Object.keys(ex.bugs).map(Number); let marks = new Set(Array.isArray(p.answer) ? p.answer : []); let res = null; let reveal = false;
  const done = () => !!p.done;
  function draw() {
    const lc = {};
    marks.forEach(l => { lc[l] = 'mark'; });
    if (res) { res.hits.forEach(l => { lc[l] = 'hit'; }); res.fps.forEach(l => { lc[l] = 'fp'; }); if (reveal) res.miss.forEach(l => { lc[l] = 'miss'; }); }
    if (done()) bugs.forEach(l => { lc[l] = 'hit'; });
    el.innerHTML = head(ex) + codeBlock(ex.code, done() ? '' : 'pick', lc) +
      '<div class="row"><button class="btn pri" id="sb" ' + (done() ? 'disabled' : '') + '>' + ic('send') + ' Nộp bài</button><span class="muted" style="font-size:13px">' + (done() ? '' : 'Đã chọn ' + marks.size + ' dòng · bấm vào dòng để chọn/bỏ chọn') + '</span></div><div id="fb"></div><div id="hn"></div>';
    if (!done()) $$('.code li', el).forEach(li => li.addEventListener('click', () => { const l = +li.dataset.l; if (marks.has(l)) marks.delete(l); else marks.add(l); p.answer = [...marks]; saveProg(); res = null; draw(); }));
    $('#sb', el).addEventListener('click', submit);
    mountHints($('#hn', el), ex);
    if (done() || (res && res.correct)) {
      $('#fb', el).innerHTML = '<div class="explain"><b>Chính xác! Các lỗi là:</b><div class="bugx" style="margin-top:8px">' + bugs.map(l => '<div><code>dòng ' + l + '</code> ' + rt(ex.bugs[l]) + '</div>').join('') + '</div></div>';
    } else if (res) {
      $('#fb', el).innerHTML = '<div class="explain bad">Tìm đúng <b>' + res.hits.length + '/' + bugs.length + '</b> lỗi' + (res.fps.length ? ', và có <b>' + res.fps.length + '</b> dòng bạn chọn không phải lỗi (gạch ngang)' : '') + '.' + (reveal ? ' Dòng màu vàng là lỗi bạn chưa tìm ra.' : '') + '</div>';
    }
  }
  function submit() {
    if (!marks.size) { toast('Hãy bấm chọn ít nhất một dòng.'); return; }
    const hits = [...marks].filter(l => bugs.includes(l)), fps = [...marks].filter(l => !bugs.includes(l)), miss = bugs.filter(l => !marks.has(l));
    const correct = hits.length === bugs.length && !fps.length; const score = Math.max(0, (hits.length - fps.length) / bugs.length);
    reveal = !correct && P(ex.id).attempts >= 2; res = { hits, fps, miss, correct };
    logAttempt(ex, { correct, score, answer: [...marks].sort((a, b) => a - b).join(',') });
    if (correct) toast('Chính xác!');
    draw();
  }
  draw();
}

/* --- điền chỗ trống --- */
function mountFill(el, ex) {
  const p = P(ex.id); const vals = Object.assign({}, p.answer || {}); let marks = {};
  function draw() {
    const src = ex.code.replace(/\{\{(\d+)\}\}/g, '__B$1__');
    let html = codeBlock(src);
    html = html.replace(/\u0001(\d+)\u0001/g, (m, n) => '<input class="blank ' + (marks[n] || '') + '" data-n="' + n + '" value="' + esc(vals[n] || '') + '" spellcheck="false" autocapitalize="off" aria-label="Ô trống ' + n + '">');
    el.innerHTML = head(ex) + html + '<div class="row"><button class="btn pri" id="ck">' + ic('send') + ' Kiểm tra</button></div><div id="fb"></div><div id="hn"></div>';
    $$('.blank', el).forEach(inp => { inp.addEventListener('input', () => { vals[inp.dataset.n] = inp.value; p.answer = vals; saveProg(); }); inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }); });
    $('#ck', el).addEventListener('click', check);
    mountHints($('#hn', el), ex);
  }
  function check() {
    const keys = Object.keys(ex.answers); let ok = 0; marks = {};
    keys.forEach(n => { const good = (ex.answers[n] || []).includes((vals[n] || '').trim()); marks[n] = good ? 'ok' : 'bad'; if (good) ok++; });
    const correct = ok === keys.length;
    logAttempt(ex, { correct, score: ok / keys.length, answer: JSON.stringify(vals) });
    draw();
    $('#fb', el).innerHTML = correct ? '<div class="explain"><b>Chính xác!</b> Cả ' + keys.length + ' ô đều đúng.</div>' : '<div class="explain bad">Đúng ' + ok + '/' + keys.length + ' ô. Ô màu đỏ cần sửa lại.</div>';
    if (correct) toast('Chính xác!');
  }
  draw();
}

/* --- sắp xếp dòng --- */
function seedShuffle(arr, seed) {
  let h = 0; for (const c of seed) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
  const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { h = (Math.imul(h, 1103515245) + 12345) & 0x7fffffff; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((x, i) => x === arr[i])) a.push(a.shift());
  return a;
}
function mountOrder(el, ex) {
  const p = P(ex.id); let cur = Array.isArray(p.answer) && p.answer.length === ex.lines.length ? p.answer.slice() : seedShuffle(ex.lines, ex.id); let good = []; let dragI = null;
  function move(i, d) { const j = i + d; if (j < 0 || j >= cur.length) return; [cur[i], cur[j]] = [cur[j], cur[i]]; p.answer = cur; saveProg(); good = []; draw(); }
  function draw() {
    el.innerHTML = head(ex) + '<div class="order">' + cur.map((l, i) => '<div class="oline ' + (good[i] ? 'good' : '') + '" draggable="true" data-i="' + i + '"><span class="tx">' + esc(l) + '</span><button data-m="-1" aria-label="Chuyển lên">' + ic('up') + '</button><button data-m="1" aria-label="Chuyển xuống">' + ic('down') + '</button></div>').join('') + '</div>' +
      '<div class="row"><button class="btn pri" id="ck">' + ic('send') + ' Kiểm tra</button></div><div id="fb"></div><div id="hn"></div>';
    $$('.oline', el).forEach(row => {
      const i = +row.dataset.i;
      $$('button', row).forEach(b => b.addEventListener('click', () => move(i, +b.dataset.m)));
      row.addEventListener('dragstart', e => { dragI = i; row.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (x) { /* bỏ qua */ } });
      row.addEventListener('dragend', () => row.classList.remove('drag'));
      row.addEventListener('dragover', e => e.preventDefault());
      row.addEventListener('drop', e => { e.preventDefault(); if (dragI === null || dragI === i) return; const [x] = cur.splice(dragI, 1); cur.splice(i, 0, x); p.answer = cur; saveProg(); good = []; dragI = null; draw(); });
    });
    $('#ck', el).addEventListener('click', check);
    mountHints($('#hn', el), ex);
  }
  function check() {
    good = cur.map((l, i) => l === ex.lines[i]); const n = good.filter(Boolean).length; const correct = n === ex.lines.length;
    logAttempt(ex, { correct, score: n / ex.lines.length, answer: cur.join('\n') });
    draw();
    $('#fb', el).innerHTML = correct ? '<div class="explain"><b>Chính xác!</b> Đây là cách viết bằng guard clause: kiểm tra trường hợp đặc biệt trước, trả về sớm, phần chính nằm cuối.</div>' : '<div class="explain bad">Đúng vị trí ' + n + '/' + ex.lines.length + ' dòng (viền xanh). Hãy thử sắp xếp lại các dòng còn lại.</div>';
    if (correct) toast('Chính xác!');
  }
  draw();
}

/* --- viết code --- */
function gradeCode(ex, src, onlyVisible) {
  const clean = stripSrc(src); const ruleFails = [];
  (ex.rules || []).forEach(rl => {
    if (rl.forbid && new RegExp(rl.forbid).test(clean)) ruleFails.push(rl.msg);
    if (rl.need && !new RegExp(rl.need).test(clean)) ruleFails.push(rl.msg);
  });
  const comp = J.compile(src); if (comp.err) return { compile: comp, ruleFails };
  const tests = ex.tests.filter(t => !(onlyVisible && t.hide)); const rows = [];
  for (const t of tests) {
    const r = J.runCall(src, ex.fn, t.a, { maxSteps: 200000 });
    let ok = false, got;
    if (t.e[0] === '!') { const want = t.e.slice(1); ok = !!(r.ex && r.ex.cls === want); got = r.ex ? 'ném ' + r.ex.cls : r.err ? r.msg : J.show(r.value); }
    else { const exp = J.literal(t.e).value; ok = !!(r.ok && J.sameValue(r.value, exp)); got = r.ok ? J.show(r.value) : r.ex ? 'ném ' + r.ex.cls + (r.ex.msg ? ': ' + r.ex.msg : '') : r.msg; }
    rows.push({ t, ok, got, err: r.err === 'compile' ? r : null });
  }
  return { rows, ruleFails };
}
function mountCode(el, ex) {
  const p = P(ex.id); let editor; let hintsHost, solShown = false;
  el.innerHTML = head(ex) + '<div id="ed"></div>' +
    '<div class="row"><button class="btn" id="run">' + ic('run') + ' Chạy thử</button><button class="btn pri" id="sub">' + ic('send') + ' Nộp bài</button><button class="btn" id="rst">' + ic('reset') + ' Đặt lại</button><button class="btn" id="sol">' + ic('eye') + ' Đáp án mẫu</button></div>' +
    '<div class="cust"><span class="muted" style="font-size:13px">Gọi thử:</span><input id="call" spellcheck="false" aria-label="Biểu thức gọi thử" value="' + esc(ex.fn + '(' + ex.tests[0].a.join(', ') + ')') + '"><button class="btn sm" id="callb">' + ic('run') + ' Chạy</button><button class="btn sm" id="calls">Xem từng bước</button></div>' +
    '<div id="cres"></div><div id="res"></div><div id="hn"></div><div id="solb"></div>';
  editor = makeEditor($('#ed', el), typeof p.answer === 'string' ? p.answer : ex.starter, { onInput: v => { p.answer = v; draftSave(); }, onRun: () => runVisible() });
  let dt; const draftSave = () => { clearTimeout(dt); dt = setTimeout(saveProg, 400); };
  mountHints($('#hn', el), ex);
  const showSolBtn = () => { const b = $('#sol', el); const open = P(ex.id).done || P(ex.id).attempts >= 3; b.disabled = !open; b.title = open ? '' : 'Mở khóa sau 3 lần nộp chưa đạt'; }; showSolBtn();

  function compileBanner(c) {
    if (c.line) editor.mark(c.line);
    return '<div class="banner bad">Lỗi biên dịch' + (c.line ? ' (dòng ' + c.line + ')' : '') + ': ' + esc(c.msg) + '</div>';
  }
  function showRows(g, hiddenNote) {
    const res = $('#res', el);
    if (g.compile) { res.innerHTML = compileBanner(g.compile); return; }
    const rf = g.ruleFails.map(m => '<div class="banner warn">' + esc(m) + '</div>').join('');
    const pass = g.rows.filter(r => r.ok).length;
    const first = g.rows.find(r => r.err);
    if (first) { editor.mark(first.err.line); }
    let hi = 0;
    const ce = g.rows.find(r => r.err);
    res.innerHTML = (ce ? compileBanner(ce.err) : '') + '<div class="banner ' + (pass === g.rows.length && !g.ruleFails.length ? 'ok' : 'bad') + '" style="margin-bottom:8px">Đạt <b>' + pass + '/' + g.rows.length + '</b> test' + (hiddenNote ? ' (chỉ gồm test hiển thị)' : '') + '.</div>' + rf +
      '<div class="tests">' + g.rows.map(r => {
        let label; if (r.t.hide) { hi++; label = 'Test ẩn #' + hi; } else label = ex.fn + '(' + r.t.a.join(', ') + ')';
        const want = r.t.e[0] === '!' ? 'ném ' + r.t.e.slice(1) : r.t.e;
        return '<div class="trow ' + (r.ok ? 'ok' : 'bad') + '"><span class="x">' + (r.ok ? '✓' : '✗') + '</span><span>' + esc(label) + (r.t.hide ? '' : ' <small>mong đợi: ' + esc(want) + (r.ok ? '' : ' · nhận được: ' + esc(r.got)) + '</small>') + (r.t.hide && !r.ok && r.err ? '<small>' + esc(r.got) + '</small>' : '') + '</span></div>';
      }).join('') + '</div>';
  }
  function runVisible() { editor.mark(0); showRows(gradeCode(ex, editor.get(), true), true); }
  function submit() {
    editor.mark(0); const src = editor.get(); const g = gradeCode(ex, src, false); showRows(g, false);
    let correct = false, score = 0;
    if (g.rows) { const pass = g.rows.filter(r => r.ok).length; score = pass / g.rows.length; correct = pass === g.rows.length && !g.ruleFails.length; if (g.ruleFails.length) score = Math.min(score, .99); }
    p.answer = src; logAttempt(ex, { correct, score, answer: src }); showSolBtn();
    if (correct) { toast('Chính xác! Bài đã được ghi nhận.'); const h = $('#head-st', el); }
    const head0 = $('.ex-h', el); if (head0 && correct) { const pills = $('.row', head0); if (pills && !$('.pill.ok', pills)) pills.insertAdjacentHTML('beforeend', '<span class="pill ok">Đã hoàn thành</span>'); }
  }
  let lastCall = null;
  function callRun(step) {
    editor.mark(0); const src = editor.get(); const r = J.runExpr(src, $('#call', el).value, {}, { trace: !!step });
    const host = $('#cres', el);
    if (step && r.trace && r.trace.length) { host.innerHTML = '<div id="trx" style="margin-top:10px"></div>'; mountTracer($('#trx', host), src, r); return; }
    if (r.ok) host.innerHTML = '<div class="banner ok">Kết quả: <b>' + esc(J.show(r.value)) + '</b></div>' + (r.out ? '<div class="console" style="margin-top:6px"><small>Output</small>' + esc(r.out) + '</div>' : '');
    else if (r.ex) host.innerHTML = '<div class="banner bad">Ném ngoại lệ <b>' + esc(r.ex.cls) + '</b>' + (r.ex.msg ? ': ' + esc(r.ex.msg) : '') + '</div>';
    else host.innerHTML = r.err === 'compile' ? compileBanner(r) : '<div class="banner bad">' + esc(r.msg) + '</div>';
    lastCall = r;
  }
  $('#run', el).addEventListener('click', runVisible);
  $('#sub', el).addEventListener('click', submit);
  $('#callb', el).addEventListener('click', () => callRun(false));
  $('#calls', el).addEventListener('click', () => callRun(true));
  $('#call', el).addEventListener('keydown', e => { if (e.key === 'Enter') callRun(false); });
  let confirmReset = false;
  $('#rst', el).addEventListener('click', e => {
    const b = e.currentTarget;
    if (!confirmReset) { confirmReset = true; b.innerHTML = 'Bấm lần nữa để xóa'; setTimeout(() => { confirmReset = false; b.innerHTML = ic('reset') + ' Đặt lại'; }, 2500); return; }
    confirmReset = false; editor.set(ex.starter); p.answer = ex.starter; saveProg(); b.innerHTML = ic('reset') + ' Đặt lại'; $('#res', el).innerHTML = '';
  });
  $('#sol', el).addEventListener('click', () => {
    const b = $('#solb', el); if (solShown) { b.innerHTML = ''; solShown = false; return; }
    solShown = true; P(ex.id).sol = true; saveProg();
    b.innerHTML = '<div class="sec-h" style="margin:10px 2px 6px"><h3 style="font-size:15px">Đáp án mẫu</h3></div>' + codeBlock(ex.solution) + '<p class="note">Có nhiều cách viết đúng. Hãy so sánh với bài của bạn và thử hiểu từng dòng.</p>';
  });
}

/* ---------- tiến độ ---------- */
function viewProgress(st) {
  const total = ALL.length, done = ALL.filter(e => status(e.id) === 'done').length, tries = Object.values(prog).reduce((a, p) => a + (p.attempts || 0), 0), hints = Object.values(prog).reduce((a, p) => a + (p.hints || 0), 0);
  st.innerHTML = '<div class="stats"><div class="card stat"><b>' + done + '/' + total + '</b><span>Bài đã hoàn thành</span></div><div class="card stat"><b>' + Math.round(100 * done / total) + '%</b><span>Tiến độ tổng</span></div><div class="card stat"><b>' + tries + '</b><span>Lượt nộp bài</span></div><div class="card stat"><b>' + hints + '</b><span>Gợi ý đã dùng</span></div></div>' +
    SEC.map(s => {
      const x = secStats(s);
      return '<div class="card" style="--h:' + s.hue + ';margin-bottom:14px"><div class="card-h"><h4>Phần ' + s.num + ': ' + esc(s.title) + '</h4><span class="pill ' + (x.pct === 100 ? 'ok' : '') + '">' + x.done + '/' + x.total + '</span></div><div class="bar" style="margin-bottom:10px"><i style="width:' + x.pct + '%"></i></div>' +
        '<div style="overflow-x:auto"><table class="ptable"><thead><tr><th>Bài</th><th>Loại</th><th>Trạng thái</th><th>Lần nộp</th><th>Gợi ý</th></tr></thead><tbody>' + s.exercises.map(e => {
          const p = prog[e.id] || {}; const stt = status(e.id);
          return '<tr><td><a href="#/' + s.id + '/ex/' + e.id + '" style="color:inherit;font-weight:700">' + esc(e.title) + '</a></td><td>' + TYPE[e.type] + '</td><td><span class="pill ' + (stt === 'done' ? 'ok' : stt === 'try' ? 'warn' : '') + '">' + (stt === 'done' ? 'Đã đạt' : stt === 'try' ? 'Đang làm' : 'Chưa làm') + '</span></td><td>' + (p.attempts || 0) + '</td><td>' + (p.hints || 0) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }).join('');
}

/* ---------- hồ sơ ---------- */
function viewMe(st) {
  const msg = { off: 'Chưa cấu hình Google Sheet. Kết quả đang được lưu trên máy này.', idle: 'Đã kết nối Google Sheet.', sending: 'Đang gửi…', ok: 'Đã gửi tất cả kết quả về Google Sheet.', err: 'Chưa gửi được (mất mạng?). Kết quả được giữ lại và sẽ gửi lại sau.' }[syncState];
  st.innerHTML = '<div class="lesson"><div class="card"><div class="card-h"><h4>Hồ sơ</h4></div><div class="row"><span class="chip" style="pointer-events:none"><span class="av">' + esc(initials(user.name)) + '</span><span><b>' + esc(user.name) + '</b><small>' + esc(user.mssv) + '</small></span></span><button class="btn sm" id="lo">Đổi người dùng</button></div><p class="note">Đổi người dùng sẽ giữ lại tiến độ của từng mã số sinh viên trên máy này.</p></div>' +
    '<div class="card"><div class="card-h"><h4>Giao diện</h4></div><div class="seg" style="margin:0">' + [['auto', 'Theo thiết bị'], ['light', 'Sáng'], ['dark', 'Tối']].map(t => '<button data-th="' + t[0] + '" class="' + (theme === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div></div>' +
    '<div class="card"><div class="card-h"><h4>Gửi kết quả</h4><span class="pill ' + (syncState === 'ok' || syncState === 'idle' ? 'ok' : syncState === 'err' ? 'bad' : 'warn') + '">' + (outbox.length ? outbox.length + ' chờ gửi' : 'Không có bài chờ') + '</span></div><p>' + esc(msg) + '</p><div class="row" style="margin-top:10px"><button class="btn sm" id="fl" ' + (CFG.SHEET_URL ? '' : 'disabled') + '>' + ic('send') + ' Gửi lại ngay</button></div></div>' +
    '<div class="card"><div class="card-h"><h4>Dữ liệu trên máy</h4></div><p class="note" style="margin-top:0">Xóa toàn bộ tiến độ lưu trên trình duyệt này. Kết quả đã gửi về Google Sheet không bị ảnh hưởng.</p><button class="btn sm" id="clr" style="margin-top:8px">Xóa tiến độ của tôi</button></div></div>';
  $('#lo', st).addEventListener('click', () => { store.del('jv_user'); user = null; prog = {}; location.hash = '#/home'; render(); });
  $$('[data-th]', st).forEach(b => b.addEventListener('click', () => { theme = b.dataset.th; store.set('jv_theme', theme); applyTheme(); viewMe(st); }));
  const fl = $('#fl', st); fl.addEventListener('click', async () => { await flush(); toast(syncState === 'ok' ? 'Đã gửi xong' : 'Chưa gửi được'); viewMe(st); });
  let sure = false; $('#clr', st).addEventListener('click', e => { if (!sure) { sure = true; e.currentTarget.textContent = 'Bấm lần nữa để xác nhận xóa'; return; } prog = {}; store.del('jv_prog_' + user.mssv); toast('Đã xóa tiến độ'); viewMe(st); });
}

/* ---------- khởi động ---------- */
window.addEventListener('hashchange', render);
window.addEventListener('online', flush);
render(); flush();
})();

</script>
